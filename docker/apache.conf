<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/classement/public
    DirectoryIndex index.html index.php

    # Upstream Utils::siteURL() reads $_SERVER['HTTPS'] directly.
    # Trust forwarded HTTPS only from the configured IMMEDIATE proxy peer.
    # Default 127.0.0.1/32 is effectively disabled for host-to-Docker published ports.
    SetEnvIfExpr "-R '${APACHE_TRUSTED_PROXY_CIDR}' && req('X-Forwarded-Proto') == 'https'" HTTPS=on

    <Directory /var/www/classement/public>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Defense in depth: uploaded files must never be executed as PHP.
    <Directory /var/www/classement/public/images>
        php_admin_flag engine off
        AllowOverride None
        Options -ExecCGI -Indexes
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
